# The demo app of the checklist panel. `xcodegen generate` in this folder
# rebuilds ConveyorDemo.xcodeproj from this file.
name: ConveyorDemo
options:
  bundleIdPrefix: app.realize
  deploymentTarget:
    iOS: "26.0"
packages:
  ConveyorCheck:
    path: ../ConveyorCheck
targets:
  ConveyorDemo:
    type: application
    platform: iOS
    sources: [ConveyorDemo]
    dependencies:
      - package: ConveyorCheck
        product: ConveyorCheck
      - package: ConveyorCheck
        product: ConveyorCheckUI
    info:
      path: ConveyorDemo/Info.plist
      properties:
        CFBundleDisplayName: HITL
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: Чтобы показать очередь проверок с твоего Мака, приложение находит его в домашней сети.
    entitlements:
      path: ConveyorDemo/ConveyorDemo.entitlements
      properties:
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.realize.conveyor-demo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
schemes:
  ConveyorDemo:
    build:
      targets:
        ConveyorDemo: all
    run:
      config: Debug
