[package]
name = "hitl"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
name = "hitl"
path = "src/lib.rs"

[[bin]]
name = "hitl"
path = "src/main.rs"

[dependencies]
libc = "=0.2.191"
rusqlite = "=0.40.2"
serde_json = { version = "=1.0.154", features = ["preserve_order", "float_roundtrip"] }
sha2 = "=0.10.9"
serde = "=1.0.229"
