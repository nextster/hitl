# Every crate of hitl is a member of one workspace: `cargo test` builds them in one go, each library once, with one
# Cargo.lock for all. A crate is still a crate of its own (`--manifest-path rust/NAME/Cargo.toml` builds it), and the
# programs are built by the file `hitl` at the root of the project.
[workspace]
resolver = "3"
members = [
    "compat-json",
    "hitl-claude",
    "hitl-host-core",
    "hitl-distribution",
    "hitl-tools",
    "hitl-phone",
    "hitl-queues",
    "hitl-host",
    "hitl",
    "journal",
    "stats",
]

[profile.release]
opt-level = 3
